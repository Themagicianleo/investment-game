<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Trade Sim: a Liquid Glass app icon in the same family as MSFS Buddy. A teal-to-violet
       gradient with soft glows, a frosted glass lens with a bright refracting rim, and inside
       it three candles and a white rising price line ending in a green dot. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3ee0b4"/>
      <stop offset="0.45" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#5a32e8"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.86" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#ff9a62" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff9a62" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.12" cy="0.08" r="0.6">
      <stop offset="0" stop-color="#c8fff0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c8fff0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#fff" stop-opacity="0.98"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1a1060" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="icon"><rect width="512" height="512" rx="114"/></clipPath>
    <clipPath id="lensClip"><circle cx="256" cy="262" r="168"/></clipPath>
  </defs>

  <g clip-path="url(#icon)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#cool)"/>
    <rect width="512" height="512" fill="url(#warm)"/>

    <g filter="url(#shadow)"><circle cx="256" cy="262" r="168" fill="url(#glass)"/></g>
    <g clip-path="url(#lensClip)">
      <ellipse cx="190" cy="150" rx="150" ry="90" fill="#fff" opacity="0.22" filter="url(#soft)"/>
      <ellipse cx="330" cy="390" rx="120" ry="60" fill="#ffc29a" opacity="0.28" filter="url(#soft)"/>
      <!-- candles -->
      <g fill="#fff" fill-opacity="0.55" stroke="#fff" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round">
        <line x1="190" y1="250" x2="190" y2="350"/><rect x="174" y="275" width="32" height="55" rx="7" stroke="none"/>
        <line x1="256" y1="215" x2="256" y2="320"/><rect x="240" y="232" width="32" height="62" rx="7" stroke="none"/>
        <line x1="322" y1="175" x2="322" y2="280"/><rect x="306" y="195" width="32" height="58" rx="7" stroke="none"/>
      </g>
    </g>
    <circle cx="256" cy="262" r="166" fill="none" stroke="url(#rim)" stroke-width="5"/>
    <circle cx="256" cy="262" r="155" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="2"/>

    <!-- rising price line -->
    <g filter="url(#shadow)">
      <path d="M128 352 L200 290 L252 318 L360 196" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M320 186 L370 186 L370 236" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="128" cy="352" r="17" fill="#34d27b" stroke="#fff" stroke-width="6"/>

    <path d="M0 0H512V170C380 205 132 205 0 170Z" fill="url(#sheen)" opacity="0.35"/>
    <rect x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="4"/>
  </g>
</svg>
