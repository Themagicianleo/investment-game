name: Update market data

# Downloads daily prices, dividends and splits from Yahoo Finance into
# web/public/data/market/, commits them if they changed, and redeploys.
on:
  schedule:
    - cron: '23 7 * * 6' # weekly, Saturday morning UTC (after Friday's US close)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - run: python scripts/fetch_market_data.py
      - name: Commit if changed
        id: commit
        run: |
          git add web/public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Market data unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update market data from Yahoo Finance ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with the workflow token don't start other workflows, so
      # start the Pages deploy explicitly.
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
